name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: python -m pip install -r requirements-dev.txt
      - name: Show import diff for Staff Center test
        run: ruff check --diff tests/test_v20_staff.py || true
      - name: Синтаксис и стиль
        run: ruff check .
      - name: Проверка компиляции
        run: python -m compileall -q app main.py
      - name: Тесты
        run: python -m pytest -q
      - name: Проверка JavaScript локальной панели
        run: |
          node --check app/web/static/app.js
          node --check app/web/static/portal.js
          node --check app/web/static/manage.js
          node --check app/web/static/obsidian.js
          node --check app/web/static/staff.js
      - name: Проверка поведения Obsidian в браузерной модели
        run: node --test tests/*.test.cjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Сборка контейнера с резервным реестром
        run: |
          docker build --build-arg PYTHON_BASE_IMAGE=python:3.12-slim-bookworm -t newsqadbot:test . ||
          docker build --build-arg PYTHON_BASE_IMAGE=public.ecr.aws/docker/library/python:3.12-slim-bookworm -t newsqadbot:test .
      - name: "Smoke: пустая база, миграции и 16 модулей"
        run: docker run --rm --entrypoint python newsqadbot:test -m app.ops.smoke

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Проверка закоммиченных файлов на секреты
        run: python scripts/check_secrets.py
      - name: Проверка известных уязвимостей зависимостей
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

  browser:
    # Playwright 1.57 does not provide Chromium for the 26.04 runner image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Python backend
        run: python -m pip install -r requirements-dev.txt
      - name: Install browser test runner
        run: npm install --no-save
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium end-to-end tests
        run: npm run test:e2e
