name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: python -m pip install -r requirements-dev.txt
      - name: Синтаксис и стиль
        run: ruff check .
      - name: Проверка компиляции
        run: python -m compileall -q app main.py
      - name: Тесты
        run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка контейнера
        run: docker build -t newsqadbot:test .
      - name: "Smoke: пустая база, миграции и 16 модулей"
        run: docker run --rm --entrypoint python newsqadbot:test -m app.ops.smoke
